name: Chequeo básico de código

# Se dispara en cada push y en cada pull request, contra cualquier rama.
on:
  push:
  pull_request:

jobs:
  syntax-check:
    name: Sintaxis e importación del backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que no haya errores de sintaxis
        run: python -m py_compile $(find backend/app -name "*.py")

      - name: Verificar que la app importe sin errores
        working-directory: backend
        env:
          # SMS_PROVIDER=console evita necesitar credenciales reales de Twilio
          # solo para poder importar la app en este chequeo automático.
          SMS_PROVIDER: console
        run: |
          python -c "from app.main import app; print('la app importa correctamente')"
